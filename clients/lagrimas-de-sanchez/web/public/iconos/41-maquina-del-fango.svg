<svg xmlns="http://www.w3.org/2000/svg" viewBox="46.39 10.42 264.18 268.79">
  <!-- El artilugio: entran papeles por el embudo, sale fango por la boca.
       Se acciona sola. -->
  <g fill="#F6F1E6">
    <!-- embudo con papeles entrando -->
    <path d="M92 66 l116 0 -22 40 -72 0 Z"/>
    <g transform="rotate(-14 120 40)"><rect x="96" y="28" width="44" height="26" rx="3"/></g>
    <g transform="rotate(11 186 34)"><rect x="164" y="22" width="40" height="24" rx="3"/></g>
    <!-- cuerpo con remaches calados y ventanilla -->
    <path fill-rule="evenodd" d="M66 106 l168 0 q12 0 12 12 l0 84 q0 12 -12 12 l-168 0 q-12 0 -12 -12 l0 -84 q0 -12 12 -12 Z
      M82 120 a6 6 0 1 0 0.1 0 Z M218 120 a6 6 0 1 0 0.1 0 Z M82 188 a6 6 0 1 0 0.1 0 Z M218 188 a6 6 0 1 0 0.1 0 Z
      M124 138 l52 0 q8 0 8 8 l0 20 q0 8 -8 8 l-52 0 q-8 0 -8 -8 l0 -20 q0 -8 8 -8 Z"/>
    <!-- boca inferior escupiendo -->
    <path d="M118 214 l64 0 0 14 q0 8 -8 8 l-48 0 q-8 0 -8 -8 Z"/>
    <path d="M138 240 q4 10 2 18 a6 6 0 1 1 -11 0 q2 -9 9 -18 Z M162 240 q5 12 3 22 a7 7 0 1 1 -13 0 q3 -11 10 -22 Z"/>
  </g>
  <!-- manivela con puño de madera -->
  <g stroke="#F6F1E6" stroke-linecap="round" fill="none">
    <circle cx="262" cy="150" r="22" stroke-width="20.77"/>
    <path d="M262 150 l26 -30" stroke-width="20.77"/>
  </g>
  <g transform="rotate(-49 288 120)"><rect x="280" y="102" width="17" height="30" rx="8" fill="#F6F1E6"/></g>
</svg>
