        L248 92 Q262 92 266 104 L272 152 Q274 166 260 168 L108 172 Q94 172 92 158 L88 112 Q86 98 96 96 Z
        M116 103 L134 102 L139 163 L121 164 Z
        M228 99 L246 98 L251 159 L233 160 Z"/>
      <!-- mango -->
      <rect x="168" y="172" width="26" height="148" rx="13"/>
      <circle cx="181" cy="326" r="21"/>
