    <!-- tas: media cúpula sobre plataforma -->
    <path d="M262 268 a66 40 0 0 1 132 0 Z"/>
    <rect x="246" y="272" width="164" height="24" rx="9"/>
    <text x="230" y="400" text-anchor="middle" font-family="Barlow Condensed, Arial Narrow, sans-serif" font-weight="700" font-size="62" letter-spacing="1.5">MARLASKONA</text>
  </g>
