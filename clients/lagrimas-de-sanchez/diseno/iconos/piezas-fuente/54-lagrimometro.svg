<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 430">
  <!-- FUENTE EDITABLE de la pieza 54. El texto va VIVO aquí; vectorizar.mjs
       lo convierte en trazados al pasar la tubería. La copia de trabajo vive
       en web/public/iconos/ y NUNCA se edita a mano: se edita ESTA y se
       vuelve a pasar la tubería. (La primera versión se dibujó en un
       scratchpad temporal y el sistema la borró: nunca más.) -->
  <!-- El dial. La aguja clavada arriba del todo: un medidor que solo sabe
       dar una lectura. Recortada AL ARO INTERIOR: desbordar el bisel leía
       como error de recorte, no como chiste. -->
  <g fill="none" stroke="#F6F1E6">
    <circle cx="75" cy="52" r="40" stroke-width="7"/>
    <circle cx="75" cy="52" r="30" stroke-width="3"/>
