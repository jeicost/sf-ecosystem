<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 214">
  <!-- FUENTE EDITABLE. La original venía de potrace con barras de 0,15 mm y
       huecos de 0,2: ilegible para cualquier malla (medido 100 %/100 %).
       Trece barras ≥0,37 mm impresos con huecos al mismo mínimo. -->
  <rect x="34" y="16" width="16" height="120" fill="#F6F1E6"/><rect x="59" y="16" width="7" height="120" fill="#F6F1E6"/><rect x="75" y="16" width="11" height="120" fill="#F6F1E6"/><rect x="95" y="16" width="7" height="120" fill="#F6F1E6"/><rect x="111" y="16" width="18" height="120" fill="#F6F1E6"/><rect x="138" y="16" width="7" height="120" fill="#F6F1E6"/><rect x="154" y="16" width="11" height="120" fill="#F6F1E6"/><rect x="174" y="16" width="11" height="120" fill="#F6F1E6"/><rect x="194" y="16" width="7" height="120" fill="#F6F1E6"/><rect x="210" y="16" width="18" height="120" fill="#F6F1E6"/><rect x="237" y="16" width="11" height="120" fill="#F6F1E6"/><rect x="257" y="16" width="7" height="120" fill="#F6F1E6"/><rect x="273" y="16" width="16" height="120" fill="#F6F1E6"/>
  <!-- Sin fila de dígitos: a 11 mm moría entera (medido). El chiste ya
       está en el código de barras + el nombre. -->
