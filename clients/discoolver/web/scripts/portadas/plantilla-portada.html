<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Portada de guía de autor — discoolver v5</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
/*
  PORTADA DE GUÍA DE AUTOR — v5.
  Parte de design/24-portada-star.html (v4, validada con el CEO) y le devuelve
  la densidad editorial de las referencias WIRED, que v4 había dejado fuera:
  la portada de Musk llena TODO el aire alrededor del sujeto y aquí sobraba
  medio lienzo de color plano. Reglas en design/inspiracion-portadas/README.md.

  Lo que v4 ya tenía y aquí NO se toca (la parte alta es intocable):
    · mancheta dis[cool]ver a sangre, autoajustada a los márgenes de 34px
    · tagline a todo el ancho
    · coverline en 3 capas: eyebrow y "que…" delante (z4), palabrón detrás del
      sujeto (z2) para que el pelo lo muerda
    · bloque de edición abajo izquierda · QR abajo derecha
    · la cara jamás se tapa: es el sujeto quien tapa al texto

  Lo que añade v5:
    · CIUDAD (P2/P10): fotografía de la ciudad virada a una tinta y fundida
      con el fondo plano; se apaga arriba y abajo para no ensuciar mancheta ni
      bloque de edición. El fondo sigue leyéndose como tinta plana.
    · MICROFRANJA de categorías bajo el tagline (P8), con los nombres
      canónicos de los territorios — no se inventan etiquetas.
    · KICKER bajo el coverline (P4): una línea, caps, tracking, con asterisco.
    · COLUMNA derecha de coverlines (P5): etiqueta en caja + titular + detalle.
    · CIFRA en caja (P5, el "100" de Musk): las 10 Saves, que son una sección
      real de todas las guías — no es un número inventado para la maqueta.
    · NOTA AL PIE que resuelve el asterisco del kicker (P9).
    · TINTA VARIABLE (--ink): las portadas claras (Málaga lima, Ibiza crema)
      necesitan tipografía oscura. v4 daba el blanco por supuesto.
    · VELO de esquina bajo el bloque de edición: iba en blanco sobre ropa clara
      y desaparecía. Esto es un fallo de v4 y hay que portarlo al editor.

  Parámetros: ?photo= &ciudad= &offset= &alto= &name= &city= &year= &quote=
    &kicker= &lbl= &tit= &det= &num= &numlbl= &numdet= &nota= &cats=
    &bg= &ink= &accent= &cop= (opacidad de la ciudad) &cmix= (blend)
*/
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #22578a; --ink: #f2f0ea; --accent: #f4b47a; --bg-0: #22578a00;
  --font-logo: 'DM Sans', sans-serif; --font-body: 'Inter', system-ui, sans-serif;
}
body { background: #555; display: flex; justify-content: center; padding: 32px 0; font-family: var(--font-body); }
.cover { width: 794px; height: 1123px; position: relative; overflow: hidden; background: var(--bg); flex-shrink: 0; color: var(--ink); }

/* ── La ciudad, virada a una tinta y fundida con el fondo ── */
.ciudad { position: absolute; inset: 0; z-index: 1; overflow: hidden; }
.ciudad img { width: 100%; height: 100%; object-fit: cover; display: block;
  filter: grayscale(1) contrast(1.25); opacity: var(--cop, .38); mix-blend-mode: var(--cmix, screen); }
/* Apaga la ciudad donde vive la tipografía: mancheta arriba, edición abajo. */
.ciudad::after { content: ''; position: absolute; inset: 0;
  background: linear-gradient(to bottom, var(--bg) 0%, var(--bg) 14%, var(--bg-0) 34%, var(--bg-0) 62%, var(--bg) 97%); }

/* ── Parte alta: intocable ── */
.masthead { position: absolute; top: 8px; left: 34px; right: 34px; z-index: 5; white-space: nowrap;
  text-align: center; font-family: var(--font-logo); font-weight: 500; font-size: 150px;
  letter-spacing: -7px; line-height: 1; color: var(--ink); }
.masthead .cool { color: var(--accent); }
.tagline { position: absolute; top: 156px; left: 34px; right: 34px; z-index: 5;
  font-family: var(--font-logo); font-weight: 400; font-size: 31px; color: var(--ink); opacity: .94; white-space: nowrap; }
/* Microfranja de categorías: el equivalente a "IDEAS TECHNOLOGY DESIGN BUSINESS" */
.cats { position: absolute; top: 202px; left: 34px; right: 34px; z-index: 5;
  padding: 7px 0; border-top: 1px solid currentColor; border-bottom: 1px solid currentColor;
  color: var(--ink); opacity: .62; font-size: 10px; font-weight: 700; letter-spacing: .16em;
  text-transform: uppercase; white-space: nowrap; text-align: center; }

/* ── Coverline en 3 capas + kicker ── */
.cl-eyebrow { position: absolute; right: 40px; top: 254px; z-index: 6; font-weight: 800;
  text-transform: uppercase; font-size: 19px; letter-spacing: .12em; color: var(--accent); }
.cl-big { position: absolute; right: 40px; top: 282px; z-index: 2; max-width: 88%; text-align: right;
  font-weight: 900; text-transform: uppercase; font-size: 74px; line-height: .96; letter-spacing: -.01em;
  color: var(--ink); white-space: nowrap; }
.cl-small { position: absolute; right: 40px; z-index: 6; max-width: 64%; text-align: right;
  font-weight: 800; font-size: 34px; line-height: 1.1; color: var(--ink); }
.cl-small .accent { color: var(--accent); }
.kicker { position: absolute; right: 40px; z-index: 6; max-width: 62%; text-align: right;
  font-weight: 800; font-size: 14px; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); }

/* ── Protagonista ── */
.photo { position: absolute; left: var(--pl, 34%); transform: translateX(-50%); bottom: 0;
  height: var(--ph, 74%); z-index: 3; display: flex; align-items: flex-end; }
.photo img { height: 100%; width: auto; object-fit: contain; object-position: bottom; display: block; }

/* ── Columna derecha de coverlines (P5) ── */
.col { position: absolute; right: 40px; top: var(--coltop, 486px); width: 232px; z-index: 6; text-align: left; }
.col__lbl { display: inline-block; background: var(--accent); color: var(--bg); font-size: 10px;
  font-weight: 900; letter-spacing: .14em; text-transform: uppercase; padding: 4px 8px; }
.col__tit { margin-top: 8px; font-weight: 900; text-transform: uppercase; font-size: 27px;
  line-height: .98; letter-spacing: -.01em; color: var(--ink); }
.col__det { margin-top: 7px; font-size: 13px; line-height: 1.35; color: var(--ink); opacity: .84; }
/* La cifra en caja: el "100" de la portada de Musk. Son las 10 Saves, una
   sección real de todas las guías, no un número de adorno. */
.num { margin-top: 26px; display: flex; align-items: flex-start; gap: 11px; }
.num__box { background: var(--ink); color: var(--bg); font-weight: 900; font-size: 78px;
  line-height: .84; letter-spacing: -.05em; padding: 8px 11px 12px; }
.num__lbl { font-weight: 900; text-transform: uppercase; font-size: 23px; line-height: 1; color: var(--ink); }
.num__det { display: block; margin-top: 6px; max-width: 132px; font-size: 12px; line-height: 1.3; color: var(--ink); opacity: .82; }

/* ── Utilitarios de abajo ── */
.scrim { position: absolute; left: 0; bottom: 0; width: 74%; height: 52%; z-index: 4; pointer-events: none;
  background: radial-gradient(125% 125% at 0% 100%, rgba(0,0,0,.55) 0%, rgba(0,0,0,.26) 34%, rgba(0,0,0,0) 70%); }
.cover.claro .scrim { background: radial-gradient(125% 125% at 0% 100%, rgba(255,255,255,.72) 0%, rgba(255,255,255,.34) 36%, rgba(255,255,255,0) 70%); }
.edition { position: absolute; left: 40px; bottom: 40px; z-index: 5; color: var(--ink); }
.edition .lbl { font-family: var(--font-logo); font-size: 29px; font-weight: 500; letter-spacing: -.5px; display: block; }
.edition .yr { font-weight: 900; font-size: 82px; line-height: 1; display: inline-flex; align-items: center; letter-spacing: -3px; }
.edition .yr svg { margin: 0 3px; }
.edition .city { font-weight: 900; font-size: 38px; letter-spacing: .5px; display: block; line-height: 1; text-transform: uppercase; }
.nota { position: absolute; right: 40px; bottom: 128px; z-index: 6; width: 210px; text-align: right;
  font-weight: 800; font-size: 11px; line-height: 1.35; letter-spacing: .04em; text-transform: uppercase; color: var(--accent); }
.qr { position: absolute; right: 40px; bottom: 40px; z-index: 6; display: flex; flex-direction: column; align-items: center; }
.qr img { width: 60px; height: 60px; background: #fff; padding: 4px; display: block; }
.qr span { font-size: 7.5px; font-weight: 900; letter-spacing: .14em; color: var(--ink); margin-top: 4px; }
</style>
</head>
<body>
<div class="cover" id="cover">
  <div class="ciudad" id="ciudad"></div>
  <div id="slot"></div>
  <div class="masthead" id="masthead">dis<span class="cool">cool</span>ver</div>
  <div class="tagline" id="tagline"></div>
  <div class="cats" id="cats"></div>
  <div class="cl-eyebrow" id="eyebrow"></div>
  <div class="cl-big" id="big"></div>
  <div class="cl-small" id="small"></div>
  <div class="kicker" id="kicker"></div>
  <div class="col" id="col">
    <span class="col__lbl" id="lbl"></span>
    <div class="col__tit" id="tit"></div>
    <div class="col__det" id="det"></div>
    <div class="num">
      <span class="num__box" id="num"></span>
      <span><span class="num__lbl" id="numlbl"></span><span class="num__det" id="numdet"></span></span>
    </div>
  </div>
  <div class="scrim"></div>
  <div class="edition">
    <span class="lbl">Guía discoolver</span>
    <span class="yr">2<svg width="56" height="50" viewBox="0 0 110 100" fill="none"><path d="M59 0 A59 50 0 0 0 59 100 Z" fill="currentColor"/><polygon points="72,13 110,50 72,87" fill="currentColor"/></svg><span id="yr">26</span></span>
    <span class="city" id="edcity"></span>
  </div>
  <div class="nota" id="nota"></div>
  <div class="qr" id="qr" style="display:none"><img id="qrimg" src="" alt=""><span>SCAN ME</span></div>
</div>
<script>
(function () {
  var P = new URLSearchParams(location.search), g = function (k, d) { var v = P.get(k); return v === null ? d : v; };
  var R = document.documentElement.style, C = document.getElementById('cover');
  var bg = g('bg', '#22578a');
  R.setProperty('--bg', bg);
  R.setProperty('--bg-0', bg + '00');   // mismo color con alfa 0: si se funde a
  R.setProperty('--ink', g('ink', '#f2f0ea'));  // `transparent` Chrome pasa por
  R.setProperty('--accent', g('accent', '#f4b47a')); // negro y ensucia la tinta
  R.setProperty('--cop', g('cop', '.38'));
  R.setProperty('--cmix', g('cmix', 'screen'));
  R.setProperty('--pl', g('offset', '34') + '%');
  R.setProperty('--ph', g('alto', '74') + '%');
  if (g('claro', '') === '1') C.classList.add('claro');

  var ciudad = g('ciudad', '');
  if (ciudad) document.getElementById('ciudad').insertAdjacentHTML('afterbegin', '<img src="' + ciudad + '" alt="">');
  var photo = g('photo', '');
  if (photo) document.getElementById('slot').innerHTML = '<div class="photo"><img src="' + photo + '" alt=""></div>';

  var city = g('city', 'Madrid');
  document.getElementById('tagline').textContent = 'Descubre los lugares + cool de ' + city;
  document.getElementById('cats').textContent = g('cats', '');
  document.getElementById('edcity').textContent = city.toUpperCase();
  document.getElementById('yr').textContent = g('year', '26');
  document.getElementById('nota').textContent = g('nota', '');
  document.getElementById('lbl').textContent = g('lbl', '');
  document.getElementById('tit').textContent = g('tit', '');
  document.getElementById('det').textContent = g('det', '');
  document.getElementById('num').textContent = g('num', '10');
  document.getElementById('numlbl').textContent = g('numlbl', 'Saves');
  document.getElementById('numdet').textContent = g('numdet', '');
  document.getElementById('kicker').textContent = g('kicker', '');

  var quote = g('quote', ''), name = g('name', ''), big = quote, small = '';
  var m = quote.match(/^(.*?)\s+que\s+(.*)$/i);
  if (m) { big = m[1]; small = 'que ' + m[2]; } else if (name) { small = 'que ' + name; }
  var eb = document.getElementById('eyebrow'), bi = document.getElementById('big'), sm = document.getElementById('small');
  if (name) eb.textContent = name;
  bi.textContent = big;
  if (small) sm.innerHTML = 'que <span class="accent">' + small.replace(/^que\s+/i, '') + '</span>';

  // Autoajustes: la mancheta a los márgenes exactos y el palabrón al ancho útil.
  requestAnimationFrame(function () {
    var mh = document.getElementById('masthead'), target = 794 - 68, size = 150;
    for (var i = 0; i < 40; i++) {
      var w = mh.scrollWidth;
      if (Math.abs(w - target) < 6) break;
      size = size * target / w; mh.style.fontSize = size + 'px';
    }
    var maxW = 794 * 0.88, s2 = 74;
    while (bi.scrollWidth > maxW && s2 > 38) { s2 -= 2; bi.style.fontSize = s2 + 'px'; }
    var top = C.getBoundingClientRect().top;
    var rb = bi.getBoundingClientRect();
    sm.style.top = (rb.bottom - top + 8) + 'px';
    requestAnimationFrame(function () {
      var rs = sm.getBoundingClientRect();
      document.getElementById('kicker').style.top = (rs.bottom - top + 16) + 'px';
      // La columna arranca por debajo del kicker, nunca encima de él.
      var rk = document.getElementById('kicker').getBoundingClientRect();
      document.getElementById('col').style.top = Math.max(486, rk.bottom - top + 46) + 'px';
    });
  });

  var qr = g('qr', '');
  if (qr) { document.getElementById('qrimg').src = qr; document.getElementById('qr').style.display = 'flex'; }
})();
</script>
</body>
</html>
