<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Disclover Guides Editor</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --primary:   #C8102E;
      --secondary: #1A1A2E;
      --accent:    #F4A300;
      --bg:        #F5F4F1;
      --surface:   #FFFFFF;
      --border:    #E0DDD8;
      --text:      #1C1C1C;
      --muted:     #888;
      --sidebar-w: 320px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ── */
    header {
      background: var(--secondary);
      color: #fff;
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 12px 20px;
      flex-shrink: 0;
    }

    header h1 { font-size: 15px; font-weight: 700; letter-spacing: 0.04em; }
    header .badge {
      background: var(--primary);
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 10px;
    }

    .guide-selector {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .guide-selector select {
      background: rgba(255,255,255,0.1);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.2);
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
    }

    .btn {
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    .btn:hover { opacity: 0.85; }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-outline {
      background: transparent;
      border: 1px solid rgba(255,255,255,0.3);
      color: #fff;
    }

    /* ── Layout ── */
    .app-body {
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    /* ── Sidebar ── */
    .sidebar {
      width: var(--sidebar-w);
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      flex-shrink: 0;
    }

    .sidebar-header {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
    }

    .guide-info {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
    }

    .guide-info__title {
      font-size: 15px;
      font-weight: 700;
      color: var(--secondary);
      margin-bottom: 4px;
    }

    .guide-info__meta {
      font-size: 11px;
      color: var(--muted);
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .status-badge {
      font-size: 10px;
      font-weight: 700;
      padding: 1px 6px;
      border-radius: 8px;
      text-transform: uppercase;
    }
    .status-draft    { background: #fef3c7; color: #92400e; }
    .status-review   { background: #dbeafe; color: #1e40af; }
    .status-published { background: #d1fae5; color: #065f46; }

    .sections-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px 0;
    }

    .section-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      cursor: pointer;
      border-left: 3px solid transparent;
      transition: background 0.1s;
    }
    .section-item:hover { background: var(--bg); }
    .section-item.active { border-left-color: var(--primary); background: #fde8ec22; }

    .section-item__dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .section-item__dot--on  { background: #22c55e; }
    .section-item__dot--off { background: #d1d5db; }

    .section-item__name { font-size: 13px; font-weight: 500; }
    .section-item__count { margin-left: auto; font-size: 11px; color: var(--muted); }

    .sidebar-footer {
      padding: 12px 16px;
      border-top: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    /* ── Chat panel ── */
    .chat-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .message {
      max-width: 720px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .message--user { align-self: flex-end; }
    .message--assistant { align-self: flex-start; }

    .message__bubble {
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.55;
      white-space: pre-wrap;
    }

    .message--user .message__bubble {
      background: var(--secondary);
      color: #fff;
      border-bottom-right-radius: 4px;
    }

    .message--assistant .message__bubble {
      background: var(--surface);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
    }

    .tool-event {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      background: #f0f9ff;
      border: 1px solid #bae6fd;
      border-radius: 8px;
      font-size: 12px;
      color: #0369a1;
      max-width: 480px;
    }

    .tool-event--success { background: #f0fdf4; border-color: #86efac; color: #166534; }
    .tool-event--error   { background: #fef2f2; border-color: #fca5a5; color: #991b1b; }

    .tool-event__icon { font-size: 14px; }
    .tool-event__name { font-weight: 700; }

    /* ── Chat input ── */
    .chat-input-area {
      padding: 16px 20px;
      border-top: 1px solid var(--border);
      background: var(--surface);
      display: flex;
      gap: 10px;
      align-items: flex-end;
    }

    .chat-input-area textarea {
      flex: 1;
      resize: none;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 14px;
      font-family: inherit;
      line-height: 1.5;
      min-height: 44px;
      max-height: 140px;
      outline: none;
      transition: border-color 0.15s;
    }
    .chat-input-area textarea:focus { border-color: var(--primary); }

    .send-btn {
      background: var(--primary);
      color: #fff;
      border: none;
      width: 44px; height: 44px;
      border-radius: 10px;
      font-size: 18px;
      cursor: pointer;
      transition: opacity 0.15s;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .send-btn:hover { opacity: 0.85; }
    .send-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* ── Empty state ── */
    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: var(--muted);
      padding: 40px;
      text-align: center;
    }
    .empty-state h2 { font-size: 20px; color: var(--secondary); }
    .empty-state p  { font-size: 14px; max-width: 360px; }

    .suggestion-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-top: 8px;
    }

    .chip {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 13px;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
    }
    .chip:hover { border-color: var(--primary); background: #fde8ec22; }

    /* ── Typing indicator ── */
    .typing { display: flex; gap: 4px; padding: 10px 14px; }
    .typing span {
      width: 6px; height: 6px;
      background: var(--muted);
      border-radius: 50%;
      animation: bounce 1.2s infinite;
    }
    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); }
      40% { transform: translateY(-5px); }
    }

    /* ── Toast ── */
    #toast {
      position: fixed;
      bottom: 20px; right: 20px;
      background: var(--secondary);
      color: #fff;
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 13px;
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
      z-index: 999;
    }
    #toast.show { opacity: 1; }
  </style>
</head>
<body>

<header>
  <h1>Disclover Guides Editor</h1>
  <span class="badge">BETA</span>
  <div class="guide-selector">
    <select id="guideSelect"></select>
    <button class="btn btn-outline" onclick="openReader()" title="Leer como flipbook">📖 Leer guía</button>
    <button class="btn btn-outline" onclick="exportPDF()">⬇ Exportar PDF</button>
  </div>
</header>

<div class="app-body">

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-header">Estructura de guía</div>
    <div class="guide-info" id="guideInfo">
      <p style="color:var(--muted);font-size:13px;">Cargando guía...</p>
    </div>
    <div class="sections-list" id="sectionsList"></div>
    <div class="sidebar-footer">
      <button class="btn" style="width:100%;background:var(--secondary);" onclick="clearSession()">
        🗑 Nueva conversación
      </button>
    </div>
  </aside>

  <!-- Chat -->
  <main class="chat-panel">
    <div class="chat-messages" id="chatMessages">
      <div class="empty-state" id="emptyState">
        <h2>¿Qué editamos hoy?</h2>
        <p>Escribe una instrucción en lenguaje natural para editar la guía.</p>
        <div class="suggestion-chips">
          <div class="chip" onclick="suggest('Añade un hotel boutique en el Born llamado Casa Bonay')">+ Hotel en el Born</div>
          <div class="chip" onclick="suggest('Desactiva la sección de Playas y Naturaleza')">Desactivar sección</div>
          <div class="chip" onclick="suggest('Reescribe la introducción de Gastronomía con un tono más local y directo')">Reescribir intro</div>
          <div class="chip" onclick="suggest('¿Qué recomendados tenemos en la sección de Gastronomía?')">Ver recomendados</div>
          <div class="chip" onclick="suggest('Cambia el estado de la guía a revisión')">Cambiar estado</div>
        </div>
      </div>
    </div>
    <div class="chat-input-area">
      <textarea
        id="chatInput"
        placeholder="Escribe una instrucción... ej: 'Añade el restaurante Disfrutar con precio €€€€'"
        rows="1"
        onkeydown="handleKey(event)"
        oninput="autoResize(this)"
      ></textarea>
      <button class="send-btn" id="sendBtn" onclick="sendMessage()" title="Enviar">➤</button>
    </div>
  </main>

</div>

<div id="toast"></div>

<script>
  let currentGuideId = null;
  let sessionId = null;
  let isStreaming = false;

  // ── Init ──────────────────────────────────────────────────────────────
  async function init() {
    await loadGuides();
  }

  async function loadGuides() {
    const res = await fetch('/api/v1/guides');
    const guides = await res.json();
    const sel = document.getElementById('guideSelect');
    sel.innerHTML = '';
    guides.forEach(g => {
      const opt = document.createElement('option');
      opt.value = g.slug;
      opt.textContent = `${g.title} (${g.type})`;
      sel.appendChild(opt);
    });
    if (guides.length) {
      currentGuideId = guides[0].slug;
      sel.value = currentGuideId;
      await loadGuide(currentGuideId);
    }
    sel.onchange = async () => {
      currentGuideId = sel.value;
      sessionId = null;
      clearMessages();
      await loadGuide(currentGuideId);
    };
  }

  async function loadGuide(id) {
    const res = await fetch(`/api/v1/guides/${id}`);
    const guide = await res.json();
    renderGuideInfo(guide);
    renderSections(guide);
  }

  function renderGuideInfo(guide) {
    const m = guide.metadata;
    document.getElementById('guideInfo').innerHTML = `
      <div class="guide-info__title">${m.title}</div>
      <div class="guide-info__meta">
        <span>${m.destination}</span>
        <span>v${m.version}</span>
        <span class="status-badge status-${m.status}">${m.status}</span>
        <span>${m.language.toUpperCase()}</span>
      </div>
    `;
  }

  function renderSections(guide) {
    const list = document.getElementById('sectionsList');
    const recs = guide.recomendados || [];
    const recCount = (sectionId) => recs.filter(r => r.section_id === sectionId && r.active).length;

    list.innerHTML = guide.sections
      .sort((a, b) => a.order - b.order)
      .map(s => `
        <div class="section-item ${s.active ? '' : 'inactive'}">
          <div class="section-item__dot section-item__dot--${s.active ? 'on' : 'off'}"></div>
          <span class="section-item__name">${s.name}</span>
          <span class="section-item__count">${recCount(s.id)} rec.</span>
        </div>
      `).join('');
  }

  // ── Chat ──────────────────────────────────────────────────────────────
  function suggest(text) {
    document.getElementById('chatInput').value = text;
    document.getElementById('chatInput').focus();
    autoResize(document.getElementById('chatInput'));
  }

  function handleKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  }

  function autoResize(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 140) + 'px';
  }

  async function sendMessage() {
    const input = document.getElementById('chatInput');
    const message = input.value.trim();
    if (!message || isStreaming || !currentGuideId) return;

    document.getElementById('emptyState')?.remove();
    input.value = '';
    autoResize(input);
    isStreaming = true;
    document.getElementById('sendBtn').disabled = true;

    appendMessage('user', message);
    const typingEl = appendTyping();

    try {
      const res = await fetch(`/api/v1/chat/${currentGuideId}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message, session_id: sessionId }),
      });

      typingEl.remove();

      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let assistantBubble = null;
      let assistantText = '';

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        const chunk = decoder.decode(value);
        const lines = chunk.split('\n').filter(l => l.startsWith('data:'));
        for (const line of lines) {
          const raw = line.slice(5).trim();
          if (!raw) continue;
          let event;
          try { event = JSON.parse(raw); } catch { continue; }

          if (event.type === 'text_delta') {
            if (!assistantBubble) assistantBubble = appendMessage('assistant', '');
            assistantText += event.delta;
            assistantBubble.querySelector('.message__bubble').textContent = assistantText;
            scrollToBottom();
          } else if (event.type === 'tool_use') {
            appendToolEvent('use', event.tool, event.input);
          } else if (event.type === 'tool_result') {
            appendToolEvent(event.success ? 'success' : 'error', event.tool, event.summary);
            // Reload guide sidebar after changes
            await loadGuide(currentGuideId);
          } else if (event.type === 'done') {
            sessionId = event.session_id;
          }
        }
      }
    } catch (err) {
      typingEl?.remove();
      appendMessage('assistant', `⚠️ Error de conexión: ${err.message}`);
    }

    isStreaming = false;
    document.getElementById('sendBtn').disabled = false;
    input.focus();
  }

  function appendMessage(role, text) {
    const container = document.getElementById('chatMessages');
    const el = document.createElement('div');
    el.className = `message message--${role}`;
    el.innerHTML = `<div class="message__bubble">${text}</div>`;
    container.appendChild(el);
    scrollToBottom();
    return el;
  }

  function appendTyping() {
    const container = document.getElementById('chatMessages');
    const el = document.createElement('div');
    el.className = 'message message--assistant';
    el.innerHTML = `<div class="message__bubble"><div class="typing"><span></span><span></span><span></span></div></div>`;
    container.appendChild(el);
    scrollToBottom();
    return el;
  }

  function appendToolEvent(type, tool, detail) {
    const container = document.getElementById('chatMessages');
    const icons = { use: '⚙️', success: '✅', error: '❌' };
    const labels = {
      toggle_section: 'Sección activada/desactivada',
      edit_section_content: 'Contenido editado',
      add_recomendado: 'Recomendado añadido',
      edit_recomendado: 'Recomendado editado',
      delete_recomendado: 'Recomendado eliminado',
      change_guide_metadata: 'Metadatos actualizados',
      adapt_to_profile: 'Perfil aplicado',
    };
    const el = document.createElement('div');
    el.className = `tool-event tool-event--${type === 'use' ? 'info' : type}`;
    const label = labels[tool] || tool;
    const desc = typeof detail === 'string' ? detail : JSON.stringify(detail).slice(0, 80);
    el.innerHTML = `<span class="tool-event__icon">${icons[type] || '⚙️'}</span><span class="tool-event__name">${label}</span><span>— ${desc}</span>`;
    container.appendChild(el);
    scrollToBottom();
  }

  function scrollToBottom() {
    const c = document.getElementById('chatMessages');
    c.scrollTop = c.scrollHeight;
  }

  function clearMessages() {
    const c = document.getElementById('chatMessages');
    c.innerHTML = `
      <div class="empty-state" id="emptyState">
        <h2>¿Qué editamos hoy?</h2>
        <p>Escribe una instrucción en lenguaje natural para editar la guía.</p>
        <div class="suggestion-chips">
          <div class="chip" onclick="suggest('Añade un hotel boutique en el Born llamado Casa Bonay')">+ Hotel en el Born</div>
          <div class="chip" onclick="suggest('Desactiva la sección de Playas y Naturaleza')">Desactivar sección</div>
          <div class="chip" onclick="suggest('Reescribe la introducción de Gastronomía con un tono más local y directo')">Reescribir intro</div>
          <div class="chip" onclick="suggest('¿Qué recomendados tenemos en la sección de Gastronomía?')">Ver recomendados</div>
        </div>
      </div>
    `;
  }

  function clearSession() {
    sessionId = null;
    clearMessages();
    showToast('Conversación reiniciada');
  }

  // ── Reader ────────────────────────────────────────────────────────────
  function openReader() {
    if (!currentGuideId) return;
    window.open(`/viewer/${currentGuideId}?guide=${currentGuideId}`, '_blank');
  }

  // ── Export ────────────────────────────────────────────────────────────
  async function exportPDF() {
    if (!currentGuideId) return;
    showToast('Generando PDF...');
    try {
      const res = await fetch(`/api/v1/guides/${currentGuideId}/export/pdf`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({}),
      });
      const data = await res.json();
      if (data.url) {
        const a = document.createElement('a');
        a.href = data.url;
        a.download = data.filename;
        a.click();
        showToast('✅ PDF descargado');
      } else {
        showToast('❌ ' + (data.detail || 'Error generando PDF'));
      }
    } catch (e) {
      showToast('❌ Error de conexión');
    }
  }

  // ── Toast ─────────────────────────────────────────────────────────────
  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2800);
  }

  init();
</script>
</body>
</html>
