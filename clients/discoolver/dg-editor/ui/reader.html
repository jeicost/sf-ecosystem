<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>discoolver — Lector de guía</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --magenta:  #C8006B;
      --dark:     #1A1A2E;
      --darker:   #0f1020;
      --surface:  #242640;
      --border:   rgba(255,255,255,0.1);
      --text:     #e8e4f0;
      --muted:    rgba(255,255,255,0.45);
      --toc-w:    240px;
    }

    html, body {
      height: 100%;
      background: var(--darker);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      overflow: hidden;
    }

    /* ── Header ── */
    header {
      height: 52px;
      background: var(--dark);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 20px;
      gap: 16px;
      flex-shrink: 0;
      z-index: 10;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .logo svg { width: 28px; height: 28px; flex-shrink: 0; }

    .logo-text {
      font-size: 17px;
      font-weight: 700;
      color: #fff;
      letter-spacing: -0.02em;
    }

    .header-sep {
      width: 1px;
      height: 20px;
      background: var(--border);
    }

    .guide-title {
      font-size: 13px;
      color: var(--muted);
      flex: 1;
    }

    .btn {
      background: var(--magenta);
      color: #fff;
      border: none;
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s;
      display: flex;
      align-items: center;
      gap: 6px;
      text-decoration: none;
    }
    .btn:hover { opacity: 0.85; }
    .btn-ghost {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
    }

    /* ── Body ── */
    .app {
      height: calc(100vh - 52px);
      display: flex;
      overflow: hidden;
    }

    /* ── TOC sidebar ── */
    .toc {
      width: var(--toc-w);
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      flex-shrink: 0;
    }

    .toc-header {
      padding: 14px 16px 10px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      border-bottom: 1px solid var(--border);
    }

    .toc-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px 0;
    }

    .toc-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 16px;
      cursor: pointer;
      border-left: 3px solid transparent;
      transition: background 0.1s, border-color 0.15s;
    }
    .toc-item:hover { background: rgba(255,255,255,0.05); }
    .toc-item.active {
      border-left-color: var(--magenta);
      background: rgba(200,0,107,0.12);
    }

    .toc-item__page {
      font-size: 10px;
      font-weight: 700;
      color: var(--magenta);
      min-width: 28px;
    }

    .toc-item__name {
      font-size: 12px;
      color: var(--text);
      line-height: 1.35;
    }

    .toc-cover, .toc-toc {
      padding: 8px 16px;
      font-size: 11px;
      color: var(--muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      border-left: 3px solid transparent;
      transition: background 0.1s;
    }
    .toc-cover:hover, .toc-toc:hover { background: rgba(255,255,255,0.05); }
    .toc-cover.active, .toc-toc.active {
      border-left-color: var(--magenta);
      background: rgba(200,0,107,0.08);
    }

    /* ── Flipbook area ── */
    .reader {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* Preloader */
    .loader {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .loader__spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(200,0,107,0.25);
      border-top-color: var(--magenta);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .loader__text {
      font-size: 13px;
      color: var(--muted);
    }

    .loader__progress {
      width: 200px;
      height: 3px;
      background: rgba(255,255,255,0.1);
      border-radius: 2px;
      overflow: hidden;
    }

    .loader__bar {
      height: 100%;
      background: var(--magenta);
      border-radius: 2px;
      transition: width 0.3s;
      width: 0%;
    }

    /* Book container */
    #book-container {
      display: none;
    }

    /* StPageFlip pages */
    .page {
      background: white;
      overflow: hidden;
    }
    .page canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* ── Controls ── */
    .controls {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(15, 16, 32, 0.9);
      backdrop-filter: blur(8px);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 8px 20px;
      z-index: 20;
    }

    .ctrl-btn {
      background: none;
      border: none;
      color: var(--text);
      cursor: pointer;
      font-size: 18px;
      padding: 4px 8px;
      border-radius: 6px;
      transition: color 0.1s, background 0.1s;
      display: flex;
      align-items: center;
    }
    .ctrl-btn:hover { color: #fff; background: rgba(255,255,255,0.1); }
    .ctrl-btn:disabled { color: var(--muted); cursor: not-allowed; }

    .page-counter {
      font-size: 12px;
      color: var(--muted);
      min-width: 80px;
      text-align: center;
      user-select: none;
    }
    .page-counter strong { color: var(--text); }

    /* Keyboard hint */
    .kbd-hint {
      position: absolute;
      top: 16px;
      right: 16px;
      font-size: 11px;
      color: var(--muted);
      background: rgba(15,16,32,0.7);
      padding: 4px 10px;
      border-radius: 10px;
      border: 1px solid var(--border);
    }

    /* ── Error state ── */
    .error-state {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      padding: 40px;
    }
    .error-state h2 { font-size: 18px; color: #fff; }
    .error-state p  { font-size: 13px; color: var(--muted); max-width: 320px; }

    /* ── Responsive: mobile ── */
    @media (max-width: 768px) {
      :root { --toc-w: 0px; }
      .toc { display: none; }
      .kbd-hint { display: none; }
    }
  </style>
</head>
<body>

<!-- Header -->
<header>
  <div class="logo">
    <!-- Logo SVG discoolver (reconstruido del isotipo) -->
    <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <circle cx="50" cy="50" r="50" fill="#C8006B"/>
      <rect x="50" y="0" width="50" height="100" fill="#C8006B" opacity="0"/>
      <!-- Mitad izquierda oscura -->
      <path d="M50,0 A50,50 0 0,0 50,100 L50,0 Z" fill="rgba(0,0,0,0.3)"/>
      <!-- Play triangle blanco -->
      <polygon points="46,32 46,68 78,50" fill="white"/>
      <!-- Separador blanco vertical -->
      <rect x="44" y="20" width="3" height="60" fill="white"/>
    </svg>
    <span class="logo-text">discoolver</span>
  </div>
  <div class="header-sep"></div>
  <div class="guide-title" id="guideTitle">Cargando guía...</div>
  <a class="btn btn-ghost" id="downloadBtn" href="#" download>
    ↓ Descargar PDF
  </a>
</header>

<div class="app">

  <!-- TOC -->
  <aside class="toc">
    <div class="toc-header">Contenido</div>
    <div class="toc-list" id="tocList">
      <div class="toc-cover active" data-page="1" onclick="goToPage(0)">
        <span style="font-size:13px">◑</span>
        <span class="toc-item__name">Portada</span>
      </div>
      <div class="toc-toc" data-page="2" onclick="goToPage(1)">
        <span style="font-size:11px;color:var(--muted)">P.2</span>
        <span class="toc-item__name">Índice</span>
      </div>
    </div>
  </aside>

  <!-- Flipbook reader -->
  <main class="reader" id="reader">

    <!-- Preloader -->
    <div class="loader" id="loader">
      <div class="loader__spinner"></div>
      <div class="loader__text" id="loaderText">Preparando la guía...</div>
      <div class="loader__progress"><div class="loader__bar" id="loaderBar"></div></div>
    </div>

    <!-- Book -->
    <div id="book-container"></div>

    <!-- Keyboard hint -->
    <div class="kbd-hint">← → para navegar · click en las páginas</div>

    <!-- Controls -->
    <div class="controls" id="controls" style="display:none">
      <button class="ctrl-btn" id="btnPrev" onclick="prevPage()" title="Página anterior">&#8592;</button>
      <div class="page-counter" id="pageCounter">–</div>
      <button class="ctrl-btn" id="btnNext" onclick="nextPage()" title="Página siguiente">&#8594;</button>
    </div>

  </main>
</div>

<!-- StPageFlip -->
<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>

<script type="module">
  // ── PDF.js setup ──────────────────────────────────────────────────────────
  import * as pdfjsLib from 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.4.168/build/pdf.min.mjs';
  pdfjsLib.GlobalWorkerOptions.workerSrc =
    'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.4.168/build/pdf.worker.min.mjs';

  // ── State ─────────────────────────────────────────────────────────────────
  const params  = new URLSearchParams(location.search);
  let guideId   = params.get('guide') || location.pathname.split('/').pop();
  let pageFlip  = null;
  let totalPages = 0;
  let currentPage = 0;
  let guide = null;

  // ── Init ──────────────────────────────────────────────────────────────────
  async function init() {
    // Cargar metadatos de la guía
    try {
      const res = await fetch(`/api/v1/guides/${guideId}`);
      guide = await res.json();
      document.getElementById('guideTitle').textContent = guide.metadata.title;
      buildTOC(guide);
    } catch(e) {
      showError('No se pudo cargar la guía', e.message);
      return;
    }

    // Generar/obtener PDF
    setLoaderText('Generando PDF...', 10);
    let pdfUrl;
    try {
      const exportRes = await fetch(`/api/v1/guides/${guideId}/export/pdf`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({})
      });
      const exportData = await exportRes.json();
      if (!exportData.url) throw new Error(exportData.detail || 'Sin URL de PDF');
      pdfUrl = exportData.url;
      document.getElementById('downloadBtn').href = pdfUrl;
      document.getElementById('downloadBtn').download = exportData.filename;
    } catch(e) {
      showError('Error generando PDF', e.message);
      return;
    }

    // Renderizar PDF con PDF.js
    setLoaderText('Renderizando páginas...', 20);
    let pdf;
    try {
      pdf = await pdfjsLib.getDocument({ url: pdfUrl, cMapUrl: 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.4.168/cmaps/', cMapPacked: true }).promise;
      totalPages = pdf.numPages;
    } catch(e) {
      showError('Error leyendo PDF', e.message);
      return;
    }

    // Calcular dimensiones del libro para que quepa en pantalla
    const readerEl = document.getElementById('reader');
    const availH   = readerEl.clientHeight - 80;   // margen controles
    const availW   = readerEl.clientWidth  - 32;

    // A4 proporciones 1:√2 ≈ 1:1.414
    // Doble página → ancho = 2 × alto/√2
    const bookH = Math.min(availH, 780);
    const pageW = Math.round(bookH / 1.414);
    const bookW = Math.min(pageW * 2, availW);
    const finalPageW = Math.round(bookW / 2);
    const finalPageH = Math.round(finalPageW * 1.414);
    const scale = finalPageW / 595;   // 595pt = ancho A4

    // Renderizar todas las páginas a canvas
    const container = document.getElementById('book-container');
    container.innerHTML = '';

    for (let i = 1; i <= totalPages; i++) {
      const progress = 20 + Math.round((i / totalPages) * 65);
      setLoaderText(`Renderizando página ${i} de ${totalPages}...`, progress);

      const page     = await pdf.getPage(i);
      const viewport = page.getViewport({ scale });

      const canvas    = document.createElement('canvas');
      canvas.width    = viewport.width;
      canvas.height   = viewport.height;
      await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;

      const div = document.createElement('div');
      div.className = 'page';
      div.style.width  = finalPageW + 'px';
      div.style.height = finalPageH + 'px';
      div.appendChild(canvas);
      container.appendChild(div);
    }

    // Arrancar StPageFlip
    setLoaderText('Preparando el libro...', 90);

    pageFlip = new St.PageFlip(container, {
      width:           finalPageW,
      height:          finalPageH,
      size:            'fixed',
      drawShadow:      true,
      flippingTime:    650,
      useMouseEvents:  true,
      swipeDistance:   30,
      showCover:       true,
      maxShadowOpacity: 0.4,
      mobileScrollSupport: false,
    });

    pageFlip.loadFromHTML(container.querySelectorAll('.page'));

    pageFlip.on('flip', (e) => {
      currentPage = e.data;
      updateUI();
    });

    // Mostrar
    setLoaderText('¡Listo!', 100);
    await new Promise(r => setTimeout(r, 300));

    document.getElementById('loader').style.display = 'none';
    container.style.display = 'block';
    document.getElementById('controls').style.display = 'flex';

    updateUI();

    // Keyboard navigation
    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
        e.preventDefault(); pageFlip.flipNext();
      }
      if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
        e.preventDefault(); pageFlip.flipPrev();
      }
    });
  }

  // ── TOC ───────────────────────────────────────────────────────────────────
  function buildTOC(guide) {
    const list = document.getElementById('tocList');
    // Limpiar entradas previas (mantenemos portada e índice)
    const fixed = list.querySelectorAll('.toc-cover, .toc-toc');

    guide.sections
      .filter(s => s.active)
      .sort((a, b) => a.order - b.order)
      .forEach((s, i) => {
        const pageNum = i + 3;   // portada=1, toc=2, secciones=3+
        const item = document.createElement('div');
        item.className = 'toc-item';
        item.dataset.page = pageNum;
        item.innerHTML = `
          <span class="toc-item__page">P.${pageNum}</span>
          <span class="toc-item__name">${s.name}</span>
        `;
        item.onclick = () => goToPage(pageNum - 1);
        list.appendChild(item);
      });
  }

  // ── Navigation ────────────────────────────────────────────────────────────
  window.goToPage = function(pageIndex) {
    if (pageFlip) pageFlip.flip(pageIndex);
  };

  window.prevPage = function() {
    if (pageFlip) pageFlip.flipPrev();
  };

  window.nextPage = function() {
    if (pageFlip) pageFlip.flipNext();
  };

  function updateUI() {
    // Contador de páginas
    const spread = pageFlip ? pageFlip.getCurrentPageIndex() : 0;
    const displayPage = spread + 1;
    document.getElementById('pageCounter').innerHTML =
      `<strong>${displayPage}</strong> / ${totalPages}`;

    // Botones prev/next
    document.getElementById('btnPrev').disabled = (currentPage === 0);
    document.getElementById('btnNext').disabled = (currentPage >= totalPages - 1);

    // TOC activo
    document.querySelectorAll('.toc-item, .toc-cover, .toc-toc').forEach(el => {
      const p = parseInt(el.dataset.page);
      el.classList.toggle('active', p === displayPage || p === displayPage + 1);
    });

    // Auto-scroll TOC
    const activeItem = document.querySelector('.toc-item.active, .toc-cover.active, .toc-toc.active');
    if (activeItem) {
      activeItem.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    }
  }

  // ── Helpers ───────────────────────────────────────────────────────────────
  function setLoaderText(text, pct) {
    document.getElementById('loaderText').textContent = text;
    document.getElementById('loaderBar').style.width  = pct + '%';
  }

  function showError(title, detail) {
    document.getElementById('loader').innerHTML = `
      <div class="error-state">
        <h2>⚠️ ${title}</h2>
        <p>${detail || 'Revisa que el servidor esté corriendo.'}</p>
        <button class="btn" onclick="location.reload()">Reintentar</button>
      </div>
    `;
  }

  // Lanzar
  init().catch(e => showError('Error inesperado', e.message));
</script>
</body>
</html>
