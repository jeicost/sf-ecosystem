<!DOCTYPE html>
<html lang="{{ guide.metadata.language }}" data-guide-title="{{ guide.metadata.title }}">
<head>
  <meta charset="UTF-8">
  <title>{{ guide.metadata.title }}</title>
  <style>
    :root {
      --color-primary:    {{ guide.assets.color_palette.primary }};
      --color-secondary:  {{ guide.assets.color_palette.secondary }};
      --color-accent:     {{ guide.assets.color_palette.accent }};
      --color-background: {{ guide.assets.color_palette.background }};
      --color-text:       {{ guide.assets.color_palette.text }};
      --font-heading:     '{{ guide.assets.typography.heading_font }}', sans-serif;
      --font-body:        '{{ guide.assets.typography.body_font }}', serif;
      --font-accent:      '{{ guide.assets.typography.accent_font }}', sans-serif;
      --font-size-base:   {{ guide.assets.typography.base_size_pt }}pt;
    }
  </style>
  <link rel="stylesheet" href="{{ static_base }}/css/pdf-base.css">
  <link rel="stylesheet" href="{{ static_base }}/css/tokens.css">
  <link rel="stylesheet" href="{{ static_base }}/css/components.css">
</head>
<body>

  {# Cover #}
  {% include "base/_cover.html" %}

  {# Table of Contents #}
  <div class="toc">
    <h2 class="toc-title">Contenido</h2>
    {% for section in active_sections %}
    <div class="toc-item">
      <span class="toc-item__name">{{ section.name }}</span>
    </div>
    {% endfor %}
  </div>

  {# Sections #}
  {% for section in active_sections %}
  {% include "base/_section.html" %}
  {% endfor %}

</body>
</html>
