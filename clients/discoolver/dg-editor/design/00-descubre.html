<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Descubre — Discoolver Guide</title>
<link rel="stylesheet" href="shared/disco-base.css">
<style>

/* ── Full-bleed page ── */
.page {
  padding: 0;
  overflow: hidden;
  background: #111827;
}

/* ── HEADER — navy, impacto máximo ── */
.dsc-header {
  background: #111827;
  padding: 28px 52px 22px;
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  position: relative;
  z-index: 2;
}
/* Línea magenta izquierda */
.dsc-header::before {
  content: '';
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 5px;
  background: #C8006B;
}

.dsc-header-left { display: flex; flex-direction: column; }

.dsc-over {
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: #C8006B;
  margin-bottom: 1px;
}
.dsc-city {
  font-family: var(--font-display, 'Bebas Neue', sans-serif);
  font-size: 80px;
  color: #ffffff;
  letter-spacing: -2px;
  line-height: 0.85;
}
.dsc-tagline {
  font-size: 10px;
  font-style: italic;
  color: rgba(255,255,255,0.45);
  margin-top: 6px;
  max-width: 340px;
}

.dsc-header-right {
  text-align: right;
  padding-bottom: 8px;
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 6px;
}
.dsc-edition {
  font-family: var(--font-display, 'Bebas Neue', sans-serif);
  font-size: 18px;
  color: rgba(255,255,255,0.35);
  letter-spacing: 0.08em;
  display: flex;
  align-items: center;
  gap: 4px;
}
.dsc-wordmark {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.18);
}

/* ── Divisor ── */
.dsc-rule {
  height: 2px;
  background: linear-gradient(to right, #C8006B 0%, rgba(200,0,107,0.15) 60%, transparent 100%);
  margin: 0;
}

/* ── Grid de secciones ── */
.dsc-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  grid-template-rows: repeat(2, 1fr);
  gap: 2px;
  background: #333;  /* gap color */
  height: calc(1123px - 158px);
}

/* ── Tile ── */
.dsc-tile {
  position: relative;
  overflow: hidden;
  display: block;
  text-decoration: none;
  /* fallback color overridden inline per section */
  background: #1e1e2e;
}

/* Foto de fondo */
.dsc-tile-photo {
  position: absolute;
  inset: 0;
  background-size: cover;
  background-position: center;
  transition: transform 0.5s ease;
}
.dsc-tile:hover .dsc-tile-photo { transform: scale(1.06); }

/* Overlay con gradiente — más oscuro abajo */
.dsc-tile-overlay {
  position: absolute;
  inset: 0;
  background: linear-gradient(
    160deg,
    rgba(0,0,0,0.08) 0%,
    rgba(0,0,0,0.3)  45%,
    rgba(0,0,0,0.82) 100%
  );
}

/* Decoración: número grande en top-right cuando no hay foto */
.dsc-tile-deco {
  position: absolute;
  top: -10px;
  right: -5px;
  font-family: var(--font-display, 'Bebas Neue', sans-serif);
  font-size: 110px;
  line-height: 1;
  color: rgba(255,255,255,0.04);
  pointer-events: none;
  user-select: none;
}

/* Contenido del tile */
.dsc-tile-body {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  padding: 14px 18px 18px;
}

.dsc-tile-pg {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.1em;
  color: rgba(255,255,255,0.4);
  text-transform: uppercase;
  margin-bottom: 4px;
}

.dsc-tile-name {
  font-family: var(--font-display, 'Bebas Neue', sans-serif);
  font-size: 34px;
  color: #fff;
  letter-spacing: 0.01em;
  line-height: 0.92;
  margin-bottom: 8px;
}

.dsc-tile-badges {
  display: flex;
  flex-wrap: wrap;
  gap: 3px;
  margin-bottom: 6px;
}
.dsc-badge {
  font-size: 7px;
  font-weight: 700;
  letter-spacing: 0.06em;
  padding: 2px 6px;
  color: #fff;
  line-height: 1.4;
  text-transform: uppercase;
}

.dsc-tile-meta {
  display: flex;
  align-items: center;
  gap: 8px;
}
.dsc-tile-count {
  font-size: 9px;
  color: rgba(255,255,255,0.5);
  letter-spacing: 0.04em;
}
.dsc-tile-arrow {
  font-size: 10px;
  color: #C8006B;
  font-weight: 700;
  margin-left: auto;
  opacity: 0;
  transition: opacity 0.2s ease;
}
.dsc-tile:hover .dsc-tile-arrow { opacity: 1; }

/* Accent bottom bar — siempre visible, color de sección */
.dsc-tile-bar {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 3px;
}

</style>
</head>
<body>

      </div>
      <div class="dsc-tile-bar" style="background:#8B5CF6;"></div>
    </div>
    <div class="dsc-tile" style="background:#0d1728;">
      <div class="dsc-tile-deco">O</div>
      <div class="dsc-tile-overlay"></div>
      <div class="dsc-tile-body">
        <div class="dsc-tile-name">OCIO Y EVENTOS</div>
      </div>

    <div class="dsc-tile" style="background:#1f0d1a;">

    </div>
    <div class="dsc-tile" style="background:#0d1f18;">
      <div class="dsc-tile-deco">E</div>
      <div class="dsc-tile-overlay"></div>
      <div class="dsc-tile-body">
        <div class="dsc-tile-name">EXPERIENCIAS</div>
      </div>
      <div class="dsc-tile-bar" style="background:#10B981;"></div>
    </div>
    <div class="dsc-tile" style="background:#1f1208;">
      <div class="dsc-tile-deco">H</div>
      <div class="dsc-tile-overlay"></div>
      <div class="dsc-tile-body">
        <div class="dsc-tile-name">ALOJAMIENTOS</div>
      </div>

  </div>

</div>

<script>
/* Color de acento y fondo oscuro por sección — diseño editorial */
var _SEC_STYLE = {
  restaurantes:            { accent:'#F59E0B', bg:'#1a1408', deco:'R' },
  fiesta:                  { accent:'#8B5CF6', bg:'#100820', deco:'F' },
  ocioEventos:             { accent:'#3B82F6', bg:'#080e20', deco:'O' },
  arteExposiciones:        { accent:'#EC4899', bg:'#1a0810', deco:'A' },
  experienciasActividades: { accent:'#10B981', bg:'#081510', deco:'E' },
  alojamientos:            { accent:'#F97316', bg:'#180e04', deco:'H' },
  shopping:                { accent:'#06B6D4', bg:'#04121a', deco:'S' },
  influencers:             { accent:'#C8006B', bg:'#180410', deco:'I' },
};

var _SECTION_DEFS = [
  { key:'restaurantes',            label:'RESTAURANTES',        tmpl:'06-restaurantes.html' },
  { key:'fiesta',                  label:'FIESTA',              tmpl:'08-fiesta.html' },
  { key:'ocioEventos',             label:'OCIO Y EVENTOS',      tmpl:'09-ocio-eventos.html' },
  { key:'arteExposiciones',        label:'ARTE Y EXPOSICIONES', tmpl:'10-arte-exposiciones.html' },
  { key:'experienciasActividades', label:'EXPERIENCIAS',        tmpl:'11-experiencias.html' },
  { key:'alojamientos',            label:'ALOJAMIENTOS',        tmpl:'12-alojamientos.html' },
  { key:'shopping',                label:'SHOPPING',            tmpl:'13-shopping.html' },
  { key:'influencers',             label:'INFLUENCERS',         tmpl:'14-influencers.html' },
];

var _guideId = new URLSearchParams(location.search).get('guide') || '';

function _tile(def, sec) {
  var items  = (sec && sec.items) || [];
  var pgNum  = sec && sec.pageNumber;
  var st     = _SEC_STYLE[def.key] || { accent:'#C8006B', bg:'#111827', deco:def.label[0] };

  var fp = items.find(function(i) { return i.photo; });
  var photoBg = fp
    ? 'background-image:url("' + fp.photo + '");background-color:' + st.bg
    : '';
  var hasPhoto = !!fp;

  var badges = items
    .filter(function(i){ return i.badge; })
    .slice(0, 3)
    .map(function(i){
      var bc = window.BADGE_COLORS[i.badge] || 'rgba(255,255,255,0.2)';
      return '<span class="dsc-badge" style="background:' + bc + ';">' + i.badge + '</span>';
    }).join('');

  var count = items.length;
  var href = _guideId
    ? def.tmpl + '?guide=' + _guideId
    : def.tmpl;

  return '<a class="dsc-tile" href="' + href + '" style="background:' + st.bg + ';">'
    + (photoBg ? '<div class="dsc-tile-photo" style="' + photoBg + '"></div>' : '')
    + '<div class="dsc-tile-overlay"></div>'
    + (!hasPhoto ? '<div class="dsc-tile-deco">' + st.deco + '</div>' : '')
    + '<div class="dsc-tile-body">'
    + (pgNum ? '<div class="dsc-tile-pg">P. ' + pgNum + '</div>' : '')
    + '<div class="dsc-tile-name">' + def.label + '</div>'
    + (badges ? '<div class="dsc-tile-badges">' + badges + '</div>' : '')
    + '<div class="dsc-tile-meta">'
    + '<span class="dsc-tile-count">' + (count ? count + ' recomendado' + (count > 1 ? 's' : '') : 'próximamente') + '</span>'
    + '<span class="dsc-tile-arrow">→</span>'
    + '</div>'
    + '</div>'
    + '<div class="dsc-tile-bar" style="background:' + st.accent + ';"></div>'
    + '</a>';
}

window.onGuideData = function(cfg) {
  var city = (cfg.city || '').toUpperCase();
  var el = document.getElementById('tw-city');    if (el) el.textContent = city;
  var ye = document.getElementById('tw-year');    if (ye) ye.textContent = (cfg.year || '');
  var tg = document.getElementById('tw-tagline'); if (tg) tg.textContent = cfg.coverTagline || ('la guía de ' + (cfg.city || 'tu ciudad'));

  var secs = cfg.sections || {};
  var active = _SECTION_DEFS.filter(function(d) {
    return secs[d.key] && secs[d.key].enabled;
  });
  if (!active.length) return;

  var n    = active.length;
  var cols = n <= 2 ? n : n <= 4 ? 2 : 3;
  var rows = Math.ceil(n / cols);

  var grid = document.getElementById('sections-grid');
  if (!grid) return;
  grid.style.gridTemplateColumns = 'repeat(' + cols + ', 1fr)';
  grid.style.gridTemplateRows   = 'repeat(' + rows + ', 1fr)';
  grid.innerHTML = active.map(function(d) {
    return _tile(d, secs[d.key]);
  }).join('');
};
</script>
<script src="shared/disco-loader.js"></script>
