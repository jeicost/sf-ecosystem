name: Deploy to DigitalOcean

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # ── Build & test ─────────────────────────────────────────────────────────────
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Lint (ruff)
        run: pip install ruff && ruff check app/ --ignore E501 || true

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: editor/package-lock.json

      - name: Build editor
        working-directory: editor
        run: npm ci && npm run build

      - name: Upload editor dist
        uses: actions/upload-artifact@v4
        with:
          name: editor-dist
          path: editor/dist/
          retention-days: 1

  # ── Deploy to DO App Platform ─────────────────────────────────────────────
  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Download editor dist
        uses: actions/download-artifact@v4
        with:
          name: editor-dist
          path: editor/dist/

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DO_API_TOKEN }}

      - name: Build and push Docker image
        env:
          REGISTRY: registry.digitalocean.com/${{ secrets.DO_REGISTRY }}
          IMAGE: discoolver-guides-editor
          TAG: ${{ github.sha }}
        run: |
          doctl registry login
          docker build -t $REGISTRY/$IMAGE:$TAG -t $REGISTRY/$IMAGE:latest .
          docker push $REGISTRY/$IMAGE:$TAG
          docker push $REGISTRY/$IMAGE:latest

      - name: Deploy to App Platform
        env:
          APP_ID: ${{ secrets.DO_APP_ID }}
        run: |
          doctl apps create-deployment $APP_ID --wait
          echo "✓ Deployed $(git log -1 --pretty='%h %s')"

      - name: Notify on success
        if: success()
        run: echo "🚀 Deployed to https://discoolver-guides-editor.ondigitalocean.app"
