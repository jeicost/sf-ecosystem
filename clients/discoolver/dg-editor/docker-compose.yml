version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: discoolver_guides
      POSTGRES_USER: discoolver
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_password_change_me}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U discoolver -d discoolver_guides"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ..                        # Disclover Guides/ — includes both dg-editor/ and design-studio/
      dockerfile: dg-editor/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://discoolver:${POSTGRES_PASSWORD:-dev_password_change_me}@db:5432/discoolver_guides
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      # Cloudflare R2 (S3-compatible) — var names kept for backwards compat
      DO_SPACES_KEY: ${DO_SPACES_KEY}
      DO_SPACES_SECRET: ${DO_SPACES_SECRET}
      DO_SPACES_BUCKET: ${DO_SPACES_BUCKET:-discoolver}
      DO_SPACES_REGION: auto
      DO_SPACES_ENDPOINT: ${DO_SPACES_ENDPOINT}
      DO_SPACES_CDN_BASE: ${DO_SPACES_CDN_BASE}
      JWT_SECRET: ${JWT_SECRET:-change_this_in_production}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      ENVIRONMENT: ${ENVIRONMENT:-production}
    ports:
      - "8000:8000"
    volumes:
      - exports:/app/exports
      - guides_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  pgdata:
  exports:
  guides_data:
