[project]
name = "scoring"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["anthropic>=0.28", "pydantic>=2.7", "structlog>=24.2", "pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scoring"]
