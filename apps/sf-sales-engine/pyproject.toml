[tool.uv.workspace]
members = [
    "apps/api",
    "apps/worker",
    "packages/scrapers",
    "packages/enrichment",
    "packages/scoring",
    "packages/notion_sync",
]

[tool.uv.sources]
scrapers    = { workspace = true }
enrichment  = { workspace = true }
scoring     = { workspace = true }
notion_sync = { workspace = true }
api         = { workspace = true }
worker      = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# E501: line length handled by formatter, not worth blocking on.
# B008: FastAPI's Depends()-in-default is the framework's intended pattern, not a bug.
ignore = ["E501", "B008"]

[tool.mypy]
strict = true
python_version = "3.12"
ignore_missing_imports = false
explicit_package_bases = true
mypy_path = [
    "apps/api/src",
    "apps/worker/src",
    "packages/scrapers/src",
    "packages/enrichment/src",
    "packages/scoring/src",
    "packages/notion_sync/src",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["apps", "packages"]
