[project]
name = "worker"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "arq>=0.26",
    "structlog>=24.2",
    "pydantic-settings>=2.3",
    "supabase>=2.5",
    "enrichment",
    "scoring",
    "notion_sync",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/worker"]
