name: Deploy to Vercel

on:
  push:
    branches: [main]

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run type check
        run: pnpm typecheck

  # Every app used to deploy unconditionally on any push to main -- a change
  # to one app rebuilt and redeployed all 7. `packages/**` is treated as
  # affecting every app since any of them may depend on a shared package;
  # each app otherwise deploys only when its own folder changed.
  changes:
    runs-on: ubuntu-latest
    outputs:
      startup_factory: ${{ steps.filter.outputs.startup_factory }}
      ai_agency: ${{ steps.filter.outputs.ai_agency }}
      mira: ${{ steps.filter.outputs.mira }}
      sf_cms: ${{ steps.filter.outputs.sf_cms }}
      mira_landing: ${{ steps.filter.outputs.mira_landing }}
      sf_crm: ${{ steps.filter.outputs.sf_crm }}
      sf_links: ${{ steps.filter.outputs.sf_links }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: dorny/paths-filter diffs against the push event's
          # `before` SHA, which a shallow checkout may not contain --
          # especially for a multi-commit push.
          fetch-depth: 0
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            startup_factory:
              - &shared 'packages/**'
              - 'apps/startup-factory-web/**'
            ai_agency:
              - *shared
              - 'apps/ai-agency-sf-next/**'
            mira:
              - *shared
              - 'apps/mira/portal/**'
            sf_cms:
              - *shared
              - 'apps/sf-cms/**'
            mira_landing:
              - *shared
              - 'apps/mira-landing/**'
            sf_crm:
              - *shared
              - 'apps/sf-crm/**'
            sf_links:
              - *shared
              - 'apps/sf-links/**'

  deploy:
    needs: [typecheck, changes]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Each step below runs independently of the others' outcome --
      # `if:` conditions imply `&& success()` by default, so one app
      # failing to deploy used to skip every step listed after it in this
      # same job (found live: a mira-portal deploy failure silently
      # skipped mira-landing, sf-crm and sf-links even though mira-landing
      # had real, ready-to-ship changes). `success() || failure()` runs a
      # step regardless of an earlier step's result, while still skipping
      # on job cancellation; the job's overall conclusion still reports
      # failure if any step fails.
      - name: Deploy startup-factory-web to Vercel
        if: (success() || failure()) && needs.changes.outputs.startup_factory == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_STARTUP_FACTORY }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        run: |
          cd apps/startup-factory-web
          mkdir -p .vercel
          echo "{\"projectId\": \"$VERCEL_PROJECT_ID\", \"orgId\": \"$VERCEL_ORG_ID\"}" > .vercel/project.json
          npx vercel deploy --prod --yes --token=$VERCEL_TOKEN

      - name: Deploy ai-agency-sf-next to Vercel
        if: (success() || failure()) && needs.changes.outputs.ai_agency == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_AI_AGENCY }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        run: |
          cd apps/ai-agency-sf-next
          mkdir -p .vercel
          echo "{\"projectId\": \"$VERCEL_PROJECT_ID\", \"orgId\": \"$VERCEL_ORG_ID\"}" > .vercel/project.json
          npx vercel deploy --prod --yes --token=$VERCEL_TOKEN

      - name: Deploy mira portal to Vercel
        if: (success() || failure()) && needs.changes.outputs.mira == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_MIRA }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        run: |
          cd apps/mira/portal
          mkdir -p .vercel
          echo "{\"projectId\": \"$VERCEL_PROJECT_ID\", \"orgId\": \"$VERCEL_ORG_ID\"}" > .vercel/project.json
          npx vercel deploy --prod --yes --token=$VERCEL_TOKEN

      - name: Deploy sf-cms to Vercel
        if: (success() || failure()) && needs.changes.outputs.sf_cms == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_SF_CMS }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        run: |
          cd apps/sf-cms
          mkdir -p .vercel
          echo "{\"projectId\": \"$VERCEL_PROJECT_ID\", \"orgId\": \"$VERCEL_ORG_ID\"}" > .vercel/project.json
          npx vercel deploy --prod --yes --token=$VERCEL_TOKEN

      - name: Deploy mira-landing to Vercel
        if: (success() || failure()) && needs.changes.outputs.mira_landing == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_MIRA_LANDING }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        run: |
          cd apps/mira-landing
          mkdir -p .vercel
          echo "{\"projectId\": \"$VERCEL_PROJECT_ID\", \"orgId\": \"$VERCEL_ORG_ID\"}" > .vercel/project.json
          npx vercel deploy --prod --yes --token=$VERCEL_TOKEN

      - name: Deploy sf-crm to Vercel
        if: (success() || failure()) && needs.changes.outputs.sf_crm == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_SF_CRM }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        run: |
          cd apps/sf-crm
          mkdir -p .vercel
          echo "{\"projectId\": \"$VERCEL_PROJECT_ID\", \"orgId\": \"$VERCEL_ORG_ID\"}" > .vercel/project.json
          npx vercel deploy --prod --yes --token=$VERCEL_TOKEN

      - name: Deploy sf-links to Vercel
        if: (success() || failure()) && needs.changes.outputs.sf_links == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_SF_LINKS }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        run: |
          cd apps/sf-links
          mkdir -p .vercel
          echo "{\"projectId\": \"$VERCEL_PROJECT_ID\", \"orgId\": \"$VERCEL_ORG_ID\"}" > .vercel/project.json
          npx vercel deploy --prod --yes --token=$VERCEL_TOKEN
