name: sf-sales-engine CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/sf-sales-engine/**'
      - '.github/workflows/sf-sales-engine-ci.yml'
  push:
    branches: [main]
    paths:
      - 'apps/sf-sales-engine/**'
      - '.github/workflows/sf-sales-engine-ci.yml'

defaults:
  run:
    working-directory: apps/sf-sales-engine

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-packages --all-extras

      - name: Ruff lint
        run: uv run ruff check .
        # Non-blocking for now: this CI was dead (nested .github/, GitHub Actions
        # never scanned it) until 2026-07-19, so ~34 pre-existing lint errors in
        # untouched files were never caught. Flip to blocking once cleared.
        continue-on-error: true

      - name: Mypy type check
        run: uv run mypy apps packages
        # Non-blocking for now: mypy --strict has never successfully completed a
        # run in this repo (module-path config bug, fixed 2026-07-19) — surfaces
        # ~300 pre-existing strict-typing errors across untouched files. Needs a
        # dedicated cleanup pass before this can block merges.
        continue-on-error: true

      - name: Pytest
        run: uv run pytest --cov --cov-report=xml -q
        env:
          SUPABASE_URL: "https://test.supabase.co"
          SUPABASE_SERVICE_KEY: "test-key"
          ANTHROPIC_API_KEY: "test-key"
          REDIS_URL: "redis://localhost:6379"

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: apps/sf-sales-engine/coverage.xml
        if: always()
